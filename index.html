<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Network OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="full-screen">
    <div class="terminal-box">
      <div id="loginConsole"></div>
    </div>
  </div>

  <div id="mainTerminal" style="display:none;">
  <div id="logo">TENRI NETWORK OS // TOA-226</div>
  <div id="statusbar">SYSTEM ONLINE</div>

  <div class="quick-buttons">
    <button onclick="helpCommand()">HELP</button>
    <button onclick="showPersonnelButtons()">PERSONNEL</button>
    <button onclick="showObjectButtons()">OBJECTS</button>
  </div>

  <div class="quick-buttons">
    <button onclick="openSecretAuth()">SECRET</button>
  </div>

  <div id="output"></div>

  <div class="logout-zone">
    <button onclick="openLogoutConfirm()">LOGOUT</button>
  </div>
</div>

<div id="secretAuth" class="full-screen" style="display:none;">
  <div class="terminal-box">
    <div class="blink" style="color:var(--red);margin-bottom:15px;">[ SECURITY AUTHORIZATION REQUIRED ]</div>
    <div style="margin-bottom:10px;">Enter Clearance Password</div>

    <input type="password" id="secretPassInput" class="terminal-input">

    <div class="quick-buttons">
      <button onclick="confirmSecretAccess()">DECRYPT</button>
      <button onclick="closeSecretAuth()">ABORT</button>
    </div>

    <div id="secretError" style="margin-top:12px;color:var(--red);"></div>
  </div>
</div>

  <script src="script.js" defer></script>
</body>
</html>
