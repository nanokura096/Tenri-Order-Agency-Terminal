<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Network OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="full-screen">
    <div class="terminal-box">
      <div id="loginConsole"></div>
    </div>
  </div>

  <!-- MAIN TERMINAL -->
  <div id="mainTerminal" style="display:none;">
    <div id="logo">TENRI NETWORK OS // TOA-226</div>
    <div id="statusbar">SYSTEM ONLINE</div>

    <div id="output"></div>

    <div class="quick-buttons">
      <button onclick="helpCommand()">HELP</button>
      <button onclick="showPersonnelButtons()">PERSONNEL</button>
      <button onclick="showObjectButtons()">OBJECTS</button>
    </div>

    <div class="quick-buttons">
      <button onclick="showSecret()">SECRET</button>
      <button onclick="clearTerminal()">CLEAR</button>
      <button onclick="openLogoutConfirm()">LOGOUT</button>
    </div>
  </div>

  <div id="logoutConfirm" class="full-screen" style="display:none;">
  <div class="terminal-box">
    <div class="blink" style="color:var(--red);margin-bottom:15px;">[ SYSTEM REBOOT REQUEST ]</div>
    <div style="margin-bottom:20px;">Terminate current session?</div>

    <div class="quick-buttons">
      <button onclick="confirmLogout()">CONFIRM</button>
      <button onclick="closeLogoutConfirm()">CANCEL</button>
    </div>
  </div>
</div>

  <script src="script.js" defer></script>
</body>
</html>
