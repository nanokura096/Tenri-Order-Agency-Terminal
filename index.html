<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Order Agency TOA-226</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <div id="loginTitle">
      AUTHENTICATION REQUIRED<br>Tenri Order Agency Authentication System
    </div>
    <input type="text" id="username" placeholder="[USER ID]" autocomplete="off">
    <input type="password" id="password" placeholder="[PASS KEY]" autocomplete="off">
    <button onclick="login()">ACCESS</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="bootScreen" style="display:none;"></div>

<div id="mainTerminal" style="display:none;">
  <div id="logo">Tenri Order Agency Terminal TOA-226</div>
  <div id="statusbar"></div>

  <div class="inputArea">
    <input type="text" id="staffId" placeholder="Enter ID">
    <select id="clearance">
      <option value="0">LV 0</option>
      <option value="1">LV 1</option>
      <option value="2">LV 2</option>
      <option value="3" selected>LV 3</option>
      <option value="4">LV 4</option>
      <option value="5">LV 5</option>
    </select>
    <button onclick="searchFile()">SEARCH DATABASE</button>
  </div>

  <div id="tabs" style="display:none;">
    <button onclick="showTab('personnel')">PERSONNEL</button>
    <button onclick="showTab('ability')">ABILITY</button>
    <button onclick="showTab('artifact')">███</button>
    <button onclick="showTab('record')">RECORD</button>
  </div>

  <div id="result"></div>

  <div id="staffListTitle" onclick="toggleStaffList()" style="margin-top:20px; border-top:1px dashed #00FF41; padding-top:15px; cursor:pointer; text-align:center;">
    ▼ Show All Stuff List
  </div>
  <div id="staffList" style="display:none; margin-top:10px;"></div>
</div>

<div id="amnesticOverlay" style="display:none; position:fixed; inset:0; background:#600; color:#fff; z-index:10000; flex-direction:column; justify-content:center; align-items:center; text-align:center; font-family:monospace; padding:20px;">
    <h1 style="font-size: 3rem; margin-bottom: 20px;">[CRITICAL ERROR]</h1>
    <p style="font-size: 1.5rem; color: #ff3131;">UNAUTHORIZED ACCESS DETECTED.</p>
    <p style="font-size: 1.2rem; margin-top: 20px;">You have been DETECTED</p>
    <div style="font-size: 80px; margin: 30px;" class="blink">⚠️</div>
    <p style="font-size: 1rem; opacity: 0.8;">INITIATING CLASS-A AMNESTICS INHALATION...<br>Agents is Coming Soon.</p>
</div>

<script src="script.js"></script>
</body>
</html>
