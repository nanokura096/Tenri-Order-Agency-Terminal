<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Network OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loginScreen" class="full-screen">
    <div class="terminal-box">
      <div id="loginConsole"></div>
    </div>
  </div>

  <div id="mainTerminal" style="display:none;">
    <div id="logo">TENRI NETWORK OS // TOA-226</div>
    <div id="statusbar">SYSTEM ONLINE</div>

    <div id="output"></div>

    <div class="command-line">
      <span>>></span>
      <input type="text" id="commandInput" autocomplete="off" placeholder="ENTER COMMAND">
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
