<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Order Agency TOA-226</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- STARTUP -->
  <div id="startupScreen">
    <div class="startupText">
      TENRI NETWORK<br><br>
      LOADING...
    </div>
  </div>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="loginBox">
      <input type="text" id="username" placeholder="[USER ID]" autocomplete="off">
      <input type="password" id="password" placeholder="[PASS KEY]" autocomplete="off">
      <button id="loginBtn">ACCESS</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- BOOT -->
  <div id="bootScreen" style="display:none;"></div>

  <!-- AMNESTIC -->
  <div id="amnesticOverlay" style="display:none;"></div>

  <!-- MAIN TERMINAL -->
  <div id="mainTerminal" style="display:none;">
    <div id="logo">Tenri Order Agency Terminal TOA-226</div>
    <div id="statusbar"></div>

    <!-- SEARCH -->
    <div class="inputArea">
      <input type="text" id="staffId" placeholder="Enter ID">
      <select id="clearance">
        <option value="0">LV 0</option>
        <option value="1" selected>LV 1</option>
        <option value="2">LV 2</option>
        <option value="3">LV 3</option>
        <option value="4">LV 4</option>
        <option value="5">LV 5</option>
      </select>
      <button id="searchBtn">SEARCH DATABASE</button>
    </div>

    <!-- TABS -->
    <div id="tabs" style="display:none;">
      <button data-tab="personnel">PERSONNEL</button>
      <button data-tab="ability">ABILITY</button>
      <button data-tab="artifact">OBJECT</button>
      <button data-tab="record">RECORD</button>
    </div>

    <!-- RESULT -->
    <div id="result"></div>

    <!-- DATA PANEL -->
    <div id="dataPanel">
      <button id="dataToggleBtn">DATABASE LIST ▼</button>
      <div id="categoryTabs">
        <button onclick="setCategory('personnel')">PERSONNEL</button>
        <button onclick="setCategory('objects')">OBJECT</button>
      </div>
      <div id="dataList"></div>
    </div>

    <!-- CONTROLS -->
    <div class="bottom-controls">
      <button id="emergencyBtn" class="emergency-btn">
        REPORT EMERGENCY
      </button>
    </div>
  </div>

  <!-- AGENT DISPATCH -->
  <div id="agentDispatch" style="display:none;">
    <div id="agentLog"></div>
  </div>

  <!-- CLEARANCE AUTH -->
  <div id="clearanceAuth" style="display:none;">
    <div id="authBox">
      <div id="authTitle">[ CLEARANCE AUTHORIZATION REQUIRED ]</div>
      <div id="authLevelText">LEVEL ? ACCESS REQUEST</div>
      <input type="password" id="authInput" placeholder="ENTER PASSPHRASE" autocomplete="off">
      <button id="authSubmitBtn">AUTHORIZE</button>
      <div id="authError"></div>
    </div>
  </div>

  <!-- EMERGENCY CONSOLE -->
  <div id="emergencyConsole" style="display:none;">
    <div id="consoleLog"></div>
    <div id="consoleButtons"></div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
