<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenri Network OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loginScreen" class="full-screen">
    <div class="terminal-box">
      <div id="loginConsole">
        </div>
    </div>
  </div>

  <div id="mainTerminal" style="display:none;">
    <div id="logo">TENRI NETWORK OS // TOA-226</div>
    <div id="statusbar">SYSTEM ONLINE</div>
    <div class="search-area">
      <input type="text" id="staffId" placeholder="SEARCH ID">
      <button id="searchBtn">EXECUTE</button>
    </div>
    <div id="result"></div>
  </div>

  <div id="clearanceAuth" class="full-screen" style="display:none;">
    <div class="terminal-box danger">
      <h2 class="blink">[SECURITY BREACH]</h2>
      <input type="password" id="authInput" placeholder="AUTHENTICATION CODE">
      <div class="authButtons">
        <button id="authConfirmBtn" class="terminal-btn danger-btn">DECRYPT</button>
        <button id="authCancelBtn" class="terminal-btn">ABORT</button>
      </div>
      <div id="authError"></div>
    </div>
  </div>

  <div id="amnesticOverlay" class="full-screen" style="display:none; z-index:99999;"></div>

  <script src="script.js" defer></script>
</body>
</html>
